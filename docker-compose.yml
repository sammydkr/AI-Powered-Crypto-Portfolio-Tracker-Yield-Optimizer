version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: blockfolio
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/blockfolio
      - REDIS_URL=redis://redis:6379
      - INFURA_API_KEY=${INFURA_API_KEY}
    depends_on:
      - postgres
      - redis

  ai-service:
    build: 
      context: ./backend
      dockerfile: Dockerfile.ai
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
    depends_on:
      - backend

volumes:
  postgres_data:
